<!DOCTYPE html>
<html>

<head>
    <title>Lesson 1 - Greetings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

       <h1>Lesson 1</h1>

        <h2>Ngā Kupu Mihi</h2>

        <p class="subtitle">Greetings</p>

        <div class="word-card">
            <h2>Kia ora</h2>
            <p>Hello / Hi</p>
        </div>

        <div class="word-card">
            <h2>Haere rā</h2>
            <p>Goodbye to someone who is leaving</p>
        </div>

        <div class="word-card">
            <h2>E noho rā</h2>
            <p>Goodbye to someone who is staying</p>
        </div>

        <div class="word-card">
            <h2>Ka kite</h2>
            <p>See you</p>
        </div>

        <br>

        <button onclick="goHome()">Home</button>

        <button onclick="startQuiz()">Take Quiz</button>

    </div>

    <script>

        function goHome() {
            window.location.href = "index.html";
        }

        function startQuiz() {
            window.location.href = "quiz1.html";
        }

    </script>

</body>

</html>
