<!DOCTYPE html>
<html>

<head>
    <title>Lesson 1 Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>📝 Lesson 1 Quiz</h1>

        <p id="score">Score: 0/5</p>
        <p id="complete"></p>

        <h2>Question 1</h2>
        <p>What does "Kia ora" mean?</p>

        <button onclick="checkAnswer(1, 'hello', this)">Hello</button>
        <button onclick="checkAnswer(1, 'school', this)">School</button>
        <button onclick="checkAnswer(1, 'food', this)">Food</button>

        <p id="result1"></p>

        <h2>Question 2</h2>
        <p>What does "Haere rā" mean?</p>

        <button onclick="checkAnswer(2, 'goodbye', this)">Goodbye</button>
        <button onclick="checkAnswer(2, 'hello', this)">Hello</button>
        <button onclick="checkAnswer(2, 'food', this)">Food</button>

        <p id="result2"></p>

        <h2>Question 3</h2>
        <p>What does "E noho rā" mean?</p>

        <button onclick="checkAnswer(3, 'goodbye', this)">Goodbye</button>
        <button onclick="checkAnswer(3, 'hello', this)">Hello</button>
        <button onclick="checkAnswer(3, 'school', this)">School</button>

        <p id="result3"></p>

        <h2>Question 4</h2>
        <p>What does "Ka kite" mean?</p>

        <button onclick="checkAnswer(4, 'see you', this)">See you</button>
        <button onclick="checkAnswer(4, 'hello', this)">Hello</button>
        <button onclick="checkAnswer(4, 'food', this)">Food</button>

        <p id="result4"></p>

        <h2>Question 5</h2>
        <p>Which one means "Hello"?</p>

        <button onclick="checkAnswer(5, 'Kia ora', this)">Kia ora</button>
        <button onclick="checkAnswer(5, 'Haere rā', this)">Haere rā</button>
        <button onclick="checkAnswer(5, 'Ka kite', this)">Ka kite</button>

        <p id="result5"></p>

        <br>

        <button onclick="goBack()">Back to Lesson</button>

    </div>

    <script>

        let points = 0;

        let answered = [false, false, false, false, false];

        function checkAnswer(question, answer, button) {

            if (answered[question - 1]) {
                return;
            }

            answered[question - 1] = true;

            let correct = false;

            if (question === 1 && answer === "hello") {
                correct = true;
            }

            if (question === 2 && answer === "goodbye") {
                correct = true;
            }

            if (question === 3 && answer === "goodbye") {
                correct = true;
            }

            if (question === 4 && answer === "see you") {
                correct = true;
            }

            if (question === 5 && answer === "Kia ora") {
                correct = true;
            }

            let buttons = button.parentElement.querySelectorAll("button");

            buttons.forEach(function(btn) {
                btn.disabled = true;
            });

            if (correct) {

                points++;

                document.getElementById("result" + question).textContent =
                    "✅ Ka pai! Correct!";

            } else {

                document.getElementById("result" + question).textContent =
                    "❌ Not quite!";

            }

            document.getElementById("score").textContent =
                "Score: " + points + "/5";

            if (answered.every(Boolean)) {

                document.getElementById("complete").textContent =
                    "🎉 Quiz Complete! You got " + points + "/5! 🏆";

                if (points === 5) {

                    localStorage.setItem("lesson1Complete", "true");

                    setTimeout(function() {
                        alert("🎉 Ka pai! You completed Lesson 1!");
                    }, 200);

                }

            }

        }

        function goBack() {
            window.location.href = "lesson1.html";
        }

    </script>

</body>

</html>
