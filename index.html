<!DOCTYPE html>
<html>

<head>
    <title>Te Reo Māori Learning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🇳🇿 Te Reo Māori</h1>

        <p class="subtitle">
            Learn Te Reo Māori step by step.
        </p>

        <div class="progress-box">

            <h2>Your Progress</h2>

            <p>Level 1 • Beginner</p>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <p id="progressText">0% Complete</p>

        </div>

        <h2>📚 Lessons</h2>

        <button onclick="startLearning()">
            🟢 Lesson 1 — Greetings
        </button>

        <br><br>

        <button onclick="lessonTwo()">
            🔵 Lesson 2 — Introducing Yourself
        </button>

        <br><br>

        <button onclick="lessonThree()">
            🟣 Lesson 3 — Numbers
        </button>

    </div>

    <script>

        function startLearning() {
            window.location.href = "lesson1.html";
        }

        function lessonTwo() {
            window.location.href = "lesson2.html";
        }

        function lessonThree() {
            window.location.href = "lesson3.html";
        }

        function updateProgress() {

            let completed = 0;

            if (localStorage.getItem("lesson1Complete") === "true") {
                completed++;
            }

            if (localStorage.getItem("lesson2Complete") === "true") {
                completed++;
            }

            if (localStorage.getItem("lesson3Complete") === "true") {
                completed++;
            }

            let percentage = Math.round((completed / 3) * 100);

            document.getElementById("progress").style.width =
                percentage + "%";

            document.getElementById("progressText").textContent =
                percentage + "% Complete";

        }

        updateProgress();

    </script>

</body>

</html>
