<!DOCTYPE html>
<html>

<head>
    <title>Te Reo Māori Learning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🇳🇿 Te Reo Māori</h1>

        <p class="subtitle">
            Learn Te Reo Māori step by step.
        </p>

        <div class="progress-box">

            <h2>Your Progress</h2>

            <p id="level">Level 1 • Beginner</p>

            <p>⭐ <span id="xp">0</span> XP</p>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <p id="progressText">0% Complete</p>

        </div>

        <button onclick="startLearning()">
            ▶️ Start Learning
        </button>

        <br><br>

        <button onclick="openLessons()">
            📚 View All Lessons
        </button>

    </div>


    <script>

        function startLearning() {
            window.location.href = "lesson1.html";
        }


        function openLessons() {
            window.location.href = "lessons.html";
        }


        function updateProgress() {

            let completed = 0;

            if (localStorage.getItem("lesson1Complete") === "true") {
                completed++;
            }

            if (localStorage.getItem("lesson2Complete") === "true") {
                completed++;
            }

            if (localStorage.getItem("lesson3Complete") === "true") {
                completed++;
            }

            if (localStorage.getItem("lesson4Complete") === "true") {
                completed++;
            }


            let percentage = Math.round((completed / 4) * 100);

            let xp = completed * 100;


            document.getElementById("progress").style.width =
                percentage + "%";

            document.getElementById("progressText").textContent =
                percentage + "% Complete";

            document.getElementById("xp").textContent =
                xp;


            if (completed === 0) {

                document.getElementById("level").textContent =
                    "Level 1 • Beginner";

            } else if (completed === 1) {

                document.getElementById("level").textContent =
                    "Level 2 • Te Reo Learner";

            } else if (completed === 2) {

                document.getElementById("level").textContent =
                    "Level 3 • Kaipānui";

            } else if (completed === 3) {

                document.getElementById("level").textContent =
                    "Level 4 • Advanced Beginner";

            } else if (completed === 4) {

                document.getElementById("level").textContent =
                    "Level 5 • Te Reo Champion 🏆";

            }

        }


        updateProgress();

    </script>

</body>

</html>
