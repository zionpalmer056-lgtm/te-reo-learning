<!DOCTYPE html>
<html>

<head>
    <title>Lesson 3 Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>📝 Lesson 3 Quiz</h1>

        <p id="score">Score: 0/5</p>
        <p id="complete"></p>

        <h2>Question 1</h2>
        <p>What does "Tahi" mean?</p>

        <button onclick="checkAnswer(1, 'one')">One</button>
        <button onclick="checkAnswer(1, 'two')">Two</button>
        <button onclick="checkAnswer(1, 'three')">Three</button>

        <p id="result1"></p>

        <h2>Question 2</h2>
        <p>What does "Rua" mean?</p>

        <button onclick="checkAnswer(2, 'one')">One</button>
        <button onclick="checkAnswer(2, 'two')">Two</button>
        <button onclick="checkAnswer(2, 'five')">Five</button>

        <p id="result2"></p>

        <h2>Question 3</h2>
        <p>What does "Toru" mean?</p>

        <button onclick="checkAnswer(3, 'three')">Three</button>
        <button onclick="checkAnswer(3, 'four')">Four</button>
        <button onclick="checkAnswer(3, 'two')">Two</button>

        <p id="result3"></p>

        <h2>Question 4</h2>
        <p>What does "Whā" mean?</p>

        <button onclick="checkAnswer(4, 'five')">Five</button>
        <button onclick="checkAnswer(4, 'four')">Four</button>
        <button onclick="checkAnswer(4, 'one')">One</button>

        <p id="result4"></p>

        <h2>Question 5</h2>
        <p>What does "Rima" mean?</p>

        <button onclick="checkAnswer(5, 'five')">Five</button>
        <button onclick="checkAnswer(5, 'three')">Three</button>
        <button onclick="checkAnswer(5, 'four')">Four</button>

        <p id="result5"></p>

        <br>

        <button onclick="goBack()">Back to Lesson</button>

    </div>

    <script>

        let points = 0;

        function checkAnswer(question, answer) {

            let correct = false;

            if (question === 1 && answer === "one") {
                correct = true;
            }

            if (question === 2 && answer === "two") {
                correct = true;
            }

            if (question === 3 && answer === "three") {
                correct = true;
            }

            if (question === 4 && answer === "four") {
                correct = true;
            }

            if (question === 5 && answer === "five") {
                correct = true;
            }

            if (correct) {

                points++;

                document.getElementById("result" + question).textContent =
                    "✅ Ka pai! Correct!";

                document.getElementById("score").textContent =
                    "Score: " + points + "/5";

              if (points === 5) {

    document.getElementById("complete").textContent =
        "🎉 Quiz Complete! You got 5/5!";

    localStorage.setItem("lesson3Complete", "true");

}

            } else {

                document.getElementById("result" + question).textContent =
                    "❌ Not quite! Try again.";

            }

        }

        function goBack() {
            window.location.href = "lesson3.html";
        }

    </script>

</body>

</html>
