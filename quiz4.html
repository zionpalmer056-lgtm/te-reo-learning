<!DOCTYPE html>
<html>

<head>
    <title>Lesson 4 Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>📝 Lesson 4 Quiz</h1>

        <p id="score">Score: 0/5</p>
        <p id="complete"></p>

        <h2>Question 1</h2>
        <p>What does "Whānau" mean?</p>

        <button onclick="checkAnswer(1, 'family')">Family</button>
        <button onclick="checkAnswer(1, 'father')">Father</button>
        <button onclick="checkAnswer(1, 'son')">Son</button>

        <p id="result1"></p>

        <h2>Question 2</h2>
        <p>What does "Māmā" mean?</p>

        <button onclick="checkAnswer(2, 'mother')">Mother</button>
        <button onclick="checkAnswer(2, 'father')">Father</button>
        <button onclick="checkAnswer(2, 'daughter')">Daughter</button>

        <p id="result2"></p>

        <h2>Question 3</h2>
        <p>What does "Pāpā" mean?</p>

        <button onclick="checkAnswer(3, 'father')">Father</button>
        <button onclick="checkAnswer(3, 'mother')">Mother</button>
        <button onclick="checkAnswer(3, 'son')">Son</button>

        <p id="result3"></p>

        <h2>Question 4</h2>
        <p>What does "Tama" mean?</p>

        <button onclick="checkAnswer(4, 'daughter')">Daughter</button>
        <button onclick="checkAnswer(4, 'son')">Son</button>
        <button onclick="checkAnswer(4, 'family')">Family</button>

        <p id="result4"></p>

        <h2>Question 5</h2>
        <p>What does "Tamāhine" mean?</p>

        <button onclick="checkAnswer(5, 'daughter')">Daughter</button>
        <button onclick="checkAnswer(5, 'mother')">Mother</button>
        <button onclick="checkAnswer(5, 'father')">Father</button>

        <p id="result5"></p>

        <br>

        <button onclick="goBack()">Back to Lesson</button>

    </div>

    <script>

        let points = 0;

        function checkAnswer(question, answer) {

            let correct = false;

            if (question === 1 && answer === "family") {
                correct = true;
            }

            if (question === 2 && answer === "mother") {
                correct = true;
            }

            if (question === 3 && answer === "father") {
                correct = true;
            }

            if (question === 4 && answer === "son") {
                correct = true;
            }

            if (question === 5 && answer === "daughter") {
                correct = true;
            }

            if (correct) {

                points++;

                document.getElementById("result" + question).textContent =
                    "✅ Ka pai! Correct!";

                document.getElementById("score").textContent =
                    "Score: " + points + "/5";

                if (points === 5) {

                    document.getElementById("complete").textContent =
                        "🎉 Quiz Complete! You got 5/5! 🏆";

                    localStorage.setItem("lesson4Complete", "true");

                    setTimeout(function() {
                        alert("🎉 Ka pai! You completed Lesson 4!");
                    }, 200);

                }

            } else {

                document.getElementById("result" + question).textContent =
                    "❌ Not quite! Try again.";

            }

        }

        function goBack() {
            window.location.href = "lesson4.html";
        }

    </script>

</body>

</html>
